<svg xmlns="http://www.w3.org/2000/svg" width="160" height="260" viewBox="0 0 160 260" role="img" aria-labelledby="title desc">
  <title id="title">Taster zwischen D4 und GND</title>
  <desc id="desc">Pin D4 ist mit dem oberen Kontakt eines normalerweise offenen Tasters verbunden. Der untere Kontakt liegt an GND. Beim Druecken werden beide Kontakte verbunden.</desc>
  <rect width="160" height="260" fill="#fff"/>
  <g fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="42" cy="35" r="25"/>
    <path d="M67 35H106V101M106 159V215M106 101L78 145M85 215H127M92 224H120M100 233H112"/>
  </g>
  <g fill="#172033">
    <circle cx="106" cy="101" r="4"/>
    <circle cx="106" cy="159" r="4"/>
    <text x="42" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="20">D4</text>
    <text x="106" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">GND</text>
  </g>
</svg>
